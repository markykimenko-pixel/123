
name: Build ZombieWar

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ZombieWar.csproj -NonInteractive

      - name: Build ZombieWar
        run: msbuild ZombieWar.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal

      - name: Check DLL
        shell: pwsh
        run: |
          if (!(Test-Path "bin/Release/ZombieWar.dll")) {
            Write-Error "ZombieWar.dll was not created!"
            Get-ChildItem -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
          }
          Write-Host "BUILD SUCCESSFUL!"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: ZombieWar-Release
          path: |
            bin/Release/ZombieWar.dll
            lib/ScriptHookVDotNet3.dll
            ZombieWar.ini
          if-no-files-found: warn

