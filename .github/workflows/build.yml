name: Build ZombieWar

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore ZombieWar.csproj -NonInteractive

      - name: Build Release
        run: msbuild ZombieWar.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item bin/Release/ZombieWar.dll release/
          Copy-Item lib/ScriptHookVDotNet3.dll release/
          Copy-Item ZombieWar.ini release/
          Compress-Archive -Path release/* -DestinationPath ZombieWar-Release.zip -Force

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: ZombieWar-Release
          path: ZombieWar-Release.zip
          if-no-files-found: error
